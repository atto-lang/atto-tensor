name: Source-only gate (NOT compiler execution)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify explicit compiler admission fails closed
        run: |
          set -eu
          test -s src/tensor.ores
          test -s tests/smoke.ores
          sh -n scripts/test.sh
          set +e
          env -u ORESLANG_BIN sh scripts/test.sh
          status=$?
          set -e
          if [ "$status" -ne 78 ]; then
            echo "expected explicit UNCONFIGURED exit 78; got $status" >&2
            exit 1
          fi
          echo "SOURCE_ONLY_OK; no real Oreslang compiler was run"
